name: Turtlemint Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
      tags:
        description: 'Test tags to run (e.g., @smoke, @regression)'
        required: false
        default: '@regression'
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            name: 'Desktop Chrome'
            use: ''
          - browser: firefox
            name: 'Desktop Firefox'
            use: ''
          - browser: webkit
            name: 'Desktop Safari'
            use: ''
          - browser: chromium
            name: 'Mobile Chrome'
            use: 'mobile-chrome'
          - browser: webkit
            name: 'Mobile Safari'
            use: 'mobile-safari'
    name: ${{ matrix.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npm run typecheck

      - name: Generate Tests from Excel
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          if [ -f "Turtlemint_Old_Test_Cases_Updated_Format.xlsx" ]; then
            npm run parse:excel
            npm run generate:tests
          else
            echo "Excel file not found in repo, skipping test generation"
          fi

      - name: Run Playwright Tests
        run: |
          npx playwright test --project=${{ matrix.browser }} --grep "${{ github.event.inputs.tags || '@regression' }}"
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://www.turtlemintinsurance.com/' }}
          PINCODES: ${{ secrets.PINCODES || '400001,110001,560001' }}
          CI: 'true'

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30

      - name: Upload Test Results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 30

  merge-reports:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-*
          path: all-reports/
          merge-multiple: true

      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true

      - name: Generate merged Allure report
        run: |
          npx allure generate allure-results -o allure-report --clean

      - name: Upload merged Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-merged
          path: allure-report/
          retention-days: 30

      - name: Comment PR with report links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ��� Test Reports\n' +
                '- [Playwright HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n' +
                '- [Allure Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })